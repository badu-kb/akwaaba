# Fly.io deploy (Johannesburg region is closest to Accra on Fly).
#   fly launch --no-deploy --copy-config   (pick a unique app name)
#   fly volumes create akwaaba_data --region jnb --size 1
#   fly secrets set ANTHROPIC_API_KEY=... META_ACCESS_TOKEN=... META_PHONE_NUMBER_ID=... \
#                   META_VERIFY_TOKEN=... META_APP_SECRET=... PUBLIC_BASE_URL=https://<app>.fly.dev
#   fly deploy
app = "akwaaba"
primary_region = "jnb"

[build]

[env]
  PORT = "8000"

[[mounts]]
  source = "akwaaba_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"   # WhatsApp webhooks need it awake
  auto_start_machines = true
  min_machines_running = 1     # one machine only: SQLite lives on its volume

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
